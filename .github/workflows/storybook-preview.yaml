# Per-PR Storybook, published to sb/pr-<n>/ on the shared `sb-previews` branch and served by
# AEM Code Sync. storybook-cleanup.yaml removes it when the PR closes.
name: Storybook preview

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'blocks/**'
      - 'scripts/**'
      - 'styles/**'
      - 'icons/**'
      - 'fonts/**'
      - 'storybook/**'
      - '.storybook/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/scripts/sb-previews.sh'
      - '.github/workflows/storybook-preview.yaml'

permissions:
  contents: read

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  build:
    needs: lint
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      STORYBOOK_BASE: /sb/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build-storybook:eds
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-pr-${{ github.event.pull_request.number }}
          path: sb
          retention-days: 7

  # Fork PRs get a read-only token, so they stop at the artifact above.
  publish:
    needs: build
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://sb-previews--${{ github.event.repository.name }}--${{ github.repository_owner }}.aem.page/sb/pr-${{ github.event.pull_request.number }}/index.html
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: storybook-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/sb
      - name: Publish to sb-previews
        run: bash .github/scripts/sb-previews.sh publish "$PR" "$RUNNER_TEMP/sb"

      - name: Wait for AEM Code Sync
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            echo "Attempt $i: $PREVIEW_URL -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Preview not serving yet; Code Sync may still be processing."

      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- storybook-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Storybook preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from ${sha}. Removed automatically when this PR closes.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }