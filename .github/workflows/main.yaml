name: Build
on:
  push:
    branches-ignore:
      - storybook

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    - name: Install overlay composer dependencies
      run: npm ci --prefix ssr
    - name: Test overlay composer
      run: npm run test:ssr

  storybook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - name: Build Storybook
      run: npm run build-storybook
    - name: Upload Storybook QA build
      uses: actions/upload-artifact@v4
      with:
        name: storybook-qa
        path: storybook-static

  # Served by AEM Code Sync at https://storybook--edspdp--rahul-chawla-akqa.aem.page/sb/index.html
  storybook-deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: storybook-deploy
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - name: Build Storybook for EDS
      run: npm run build-storybook:eds
    - name: Push main plus build to the storybook branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B storybook
        git add -f sb
        git commit --no-verify -m "chore: storybook build ${GITHUB_SHA}"
        git push --force origin storybook
