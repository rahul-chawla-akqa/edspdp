name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    - name: Install overlay composer dependencies
      run: npm ci --prefix ssr
    - name: Test overlay composer
      run: npm run test:ssr
