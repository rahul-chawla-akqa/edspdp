name: Build
on:
  push:
    branches-ignore:
      - storybook
      - storybook-develop
      - sb-previews

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    - name: Install overlay composer dependencies
      run: npm ci --prefix ssr
    - name: Test overlay composer
      run: npm run test:ssr

  # main    -> https://storybook--edspdp--rahul-chawla-akqa.aem.page/sb/index.html
  # develop -> https://storybook-develop--edspdp--rahul-chawla-akqa.aem.page/sb/index.html
  storybook-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: storybook-deploy-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      STORYBOOK_BASE: /sb/
      TARGET_BRANCH: ${{ github.ref_name == 'main' && 'storybook' || 'storybook-develop' }}
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - name: Build Storybook for EDS
      run: npm run build-storybook:eds
    - name: Push branch plus build to the Storybook branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$TARGET_BRANCH"
        git add -f sb
        git commit --no-verify -m "chore: storybook build ${GITHUB_SHA}"
        git push --force origin "$TARGET_BRANCH"