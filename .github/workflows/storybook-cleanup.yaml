# Removes per-PR Storybook builds from the `sb-previews` branch. The weekly reaper catches
# anything the close handler missed (failed runs, PRs closed before this workflow existed).
name: Storybook cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remove:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Remove preview from sb-previews
        run: bash .github/scripts/sb-previews.sh remove "$PR"

      - name: Mark preview comment as expired
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- storybook-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (!existing) return;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: `${marker}\n**Storybook preview:** removed because this PR was closed.`,
            });

  reap:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Remove previews for PRs that are no longer open
        run: bash .github/scripts/sb-previews.sh reap
